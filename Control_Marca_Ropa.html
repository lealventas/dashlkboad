<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYS PRO - Gestión Rápida (Sincronizado)</title>
    
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: '#0B0F19',
                        card: '#151C2C',
                        cardhover: '#1E293B',
                        primary: '#6366F1',
                        accent: '#38BDF8',
                        success: '#10B981',
                        danger: '#F43F5E',
                        bordercolor: '#1E293B'
                    },
                    boxShadow: {
                        'neon-primary': '0 0 15px rgba(99, 102, 241, 0.3)',
                        'neon-success': '0 0 15px rgba(16, 185, 129, 0.2)',
                        'neon-danger': '0 0 15px rgba(244, 63, 94, 0.2)'
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase V8 (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0B0F19; 
            color: #E2E8F0;
            overflow-x: hidden;
        }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0B0F19; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; border: 2px solid #0B0F19; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .tab-content { display: none; opacity: 0; transform: translateY(10px); }
        .tab-content.active { display: block; opacity: 1; transform: translateY(0); transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        
        .tab-btn { position: relative; color: #64748B; transition: all 0.3s ease; }
        .tab-btn:hover { color: #F8FAFC; }
        .tab-btn.active { color: #38BDF8; font-weight: 600; }
        .tab-btn.active::after { 
            content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 2px; 
            background-color: #38BDF8; border-radius: 2px; box-shadow: 0 -2px 10px rgba(56, 189, 248, 0.6); 
        }

        .hide-scroll::-webkit-scrollbar { display: none; }
        
        input, select { 
            background-color: #0F172A !important; 
            color: #F8FAFC !important; 
            border: 1px solid #334155 !important; 
            transition: all 0.3s ease;
        }
        input:focus, select:focus { 
            border-color: #38BDF8 !important; 
            outline: none; 
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2) !important; 
        }
        input::placeholder { color: #475569 !important; }
        
        input[type="radio"] { appearance: none; width: 1.2rem; height: 1.2rem; border-radius: 50%; border: 2px solid #475569 !important; outline: none; transition: 0.2s; cursor: pointer; position: relative; }
        input[type="radio"]:checked { border-color: currentColor !important; background-color: transparent !important; }
        input[type="radio"]:checked::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 0.6rem; height: 0.6rem; border-radius: 50%; background-color: currentColor; }
        
        .card-pro { 
            background-color: #151C2C; border: 1px solid #1E293B; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
    </style>
</head>
<body class="pb-20 antialiased selection:bg-accent selection:text-dark text-sm md:text-base">

    <!-- Modal Dialog System -->
    <div id="customDialog" class="fixed inset-0 z-[100] flex items-center justify-center hidden bg-black/70 backdrop-blur-sm transition-opacity duration-300 opacity-0">
        <div id="dialogBox" class="bg-card border border-bordercolor rounded-2xl p-6 w-11/12 max-w-sm shadow-2xl transform scale-95 transition-transform duration-300 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-danger to-orange-500"></div>
            <h3 id="dialogTitle" class="text-xl font-bold text-white mb-3 mt-1">Confirmar</h3>
            <p id="dialogMessage" class="text-slate-400 mb-6 text-sm leading-relaxed">Mensaje</p>
            <div class="flex justify-end space-x-3">
                <button onclick="closeDialog()" class="px-4 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition text-sm font-medium">Cancelar</button>
                <button id="dialogConfirmBtn" class="px-5 py-2 rounded-lg bg-rose-600 text-white hover:bg-rose-500 transition font-medium shadow-neon-danger text-sm">Eliminar</button>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-[90] flex flex-col space-y-3 pointer-events-none"></div>

    <!-- Navbar Minimalista PRO -->
    <nav class="sticky top-0 z-40 bg-dark/90 backdrop-blur-xl border-b border-bordercolor shadow-lg">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-br from-primary to-accent p-1.5 rounded-lg shadow-neon-primary text-white flex items-center justify-center w-8 h-8">
                    <i class="fa-solid fa-cloud text-sm"></i>
                </div>
                <h1 class="text-lg font-extrabold tracking-wider hidden sm:block">
                    SYS<span class="text-accent">CLOUD</span>
                </h1>
            </div>
            
            <!-- Tabs Consolidadas -->
            <div class="flex overflow-x-auto hide-scroll space-x-1 sm:space-x-4">
                <button onclick="showTab('inicio')" id="tab-inicio" class="tab-btn active px-3 sm:px-4 py-2 text-sm sm:text-base whitespace-nowrap"><i class="fa-solid fa-chart-pie mr-1 sm:mr-2"></i>Resumen</button>
                <button onclick="showTab('registrar')" id="tab-registrar" class="tab-btn px-3 sm:px-4 py-2 text-sm sm:text-base whitespace-nowrap"><i class="fa-solid fa-bolt mr-1 sm:mr-2 text-accent"></i>Caja</button>
                <button onclick="showTab('pedidos')" id="tab-pedidos" class="tab-btn px-3 sm:px-4 py-2 text-sm sm:text-base whitespace-nowrap"><i class="fa-solid fa-box-open mr-1 sm:mr-2 text-orange-400"></i>Pedidos</button>
                <button onclick="showTab('inventario')" id="tab-inventario" class="tab-btn px-3 sm:px-4 py-2 text-sm sm:text-base whitespace-nowrap"><i class="fa-solid fa-boxes-stacked mr-1 sm:mr-2 text-purple-400"></i>Inventario</button>
            </div>

            <button onclick="confirmarResetTotal()" class="text-[10px] sm:text-xs border border-slate-700 bg-slate-800/50 hover:bg-rose-900/50 hover:border-rose-500 hover:text-rose-400 text-slate-400 px-2 sm:px-3 py-1.5 rounded-lg transition-all">
                <i class="fa-solid fa-power-off"></i>
            </button>
        </div>
    </nav>

    <div class="container mx-auto p-4 md:p-6 mt-2 max-w-7xl">
        
        <!-- INDICADOR NUBE -->
        <div id="cloudStatus" class="mb-4 bg-sky-900/20 border border-sky-500/30 text-sky-300 px-4 py-2 rounded-lg text-xs font-bold flex items-center shadow-lg shadow-sky-500/5 hidden">
            <i class="fa-solid fa-rotate animate-spin mr-2"></i> Conectando a la nube de Firebase...
        </div>

        <!-- TAB: INICIO (Resumen + Historial) -->
        <div id="inicio" class="tab-content active">
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-8">
                <!-- Ingresos -->
                <div class="card-pro p-5 rounded-2xl relative overflow-hidden">
                    <div class="absolute right-0 top-0 w-20 h-20 bg-success/10 rounded-full blur-2xl -mr-8 -mt-8"></div>
                    <div class="flex items-center space-x-3 mb-1">
                        <div class="w-7 h-7 rounded-full bg-success/20 text-success flex items-center justify-center text-xs"><i class="fa-solid fa-arrow-trend-up"></i></div>
                        <h3 class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Ingresos Reales</h3>
                    </div>
                    <p class="text-3xl font-bold text-white mt-2" id="totalIngresos">$0</p>
                </div>
                
                <!-- Gastos -->
                <div class="card-pro p-5 rounded-2xl relative overflow-hidden">
                    <div class="absolute right-0 top-0 w-20 h-20 bg-danger/10 rounded-full blur-2xl -mr-8 -mt-8"></div>
                    <div class="flex items-center space-x-3 mb-1">
                        <div class="w-7 h-7 rounded-full bg-danger/20 text-danger flex items-center justify-center text-xs"><i class="fa-solid fa-arrow-trend-down"></i></div>
                        <h3 class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Gastos Totales</h3>
                    </div>
                    <p class="text-3xl font-bold text-white mt-2" id="totalGastos">$0</p>
                </div>

                <!-- Utilidad -->
                <div class="card-pro p-5 rounded-2xl relative overflow-hidden border-l-4 border-l-accent">
                    <div class="absolute right-0 top-0 w-28 h-28 bg-accent/10 rounded-full blur-3xl -mr-10 -mt-10"></div>
                    <div class="flex items-center space-x-3 mb-1 relative z-10">
                        <div class="w-7 h-7 rounded-full bg-accent/20 text-accent flex items-center justify-center text-xs"><i class="fa-solid fa-wallet"></i></div>
                        <h3 class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Utilidad Neta</h3>
                    </div>
                    <p class="text-4xl font-black text-white mt-1 tracking-tight relative z-10" id="gananciaNeta">$0</p>
                </div>
            </div>
            
            <div class="card-pro p-5 md:p-6 rounded-2xl">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-5 border-b border-bordercolor pb-4">
                    <h2 class="text-lg font-bold text-white mb-3 sm:mb-0"><i class="fa-solid fa-list-check mr-2 text-slate-400"></i>Últimos Movimientos de Caja</h2>
                    <button onclick="limpiarHistorial()" class="text-xs text-rose-400 hover:text-white bg-rose-900/20 hover:bg-rose-600 px-3 py-1.5 rounded-lg border border-rose-900/50 hover:border-rose-500 transition shadow-sm">
                        <i class="fa-solid fa-broom mr-1"></i> Limpiar Registro
                    </button>
                </div>
                
                <div class="overflow-x-auto hide-scroll rounded-xl border border-bordercolor">
                    <table class="min-w-full text-left border-collapse">
                        <thead class="bg-cardhover border-b border-bordercolor">
                            <tr>
                                <th class="py-3 px-4 text-[10px] font-semibold text-slate-400 uppercase tracking-wider whitespace-nowrap">Fecha</th>
                                <th class="py-3 px-4 text-[10px] font-semibold text-slate-400 uppercase tracking-wider">Detalle</th>
                                <th class="py-3 px-4 text-[10px] font-semibold text-slate-400 uppercase tracking-wider">Categoría</th>
                                <th class="py-3 px-4 text-[10px] font-semibold text-slate-400 uppercase tracking-wider text-right">Monto</th>
                                <th class="py-3 px-4 text-[10px] font-semibold text-slate-400 uppercase tracking-wider text-center">X</th>
                            </tr>
                        </thead>
                        <tbody id="listaHistorial" class="divide-y divide-bordercolor text-sm">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- TAB: REGISTRAR -->
        <div id="registrar" class="tab-content">
            <div class="max-w-3xl mx-auto card-pro p-5 md:p-8 rounded-2xl relative overflow-hidden border-t-4 border-t-accent shadow-2xl shadow-accent/5">
                
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-black text-white flex items-center tracking-tight">
                        <i class="fa-solid fa-bolt text-accent mr-3"></i>Terminal Rápida
                    </h2>
                </div>
                
                <div class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-6 bg-cardhover p-1.5 rounded-xl border border-slate-700/50">
                    <label class="flex flex-col items-center justify-center text-center cursor-pointer p-2 rounded-lg hover:bg-slate-700/50 transition">
                        <input type="radio" name="tipoMov" value="venta" checked onchange="toggleForm()" class="accent-success mb-1 w-4 h-4">
                        <span class="font-bold text-slate-200 text-xs">Venta</span>
                    </label>
                    <label class="flex flex-col items-center justify-center text-center cursor-pointer p-2 rounded-lg hover:bg-slate-700/50 transition">
                        <input type="radio" name="tipoMov" value="compra_mat" onchange="toggleForm()" class="accent-accent mb-1 w-4 h-4">
                        <span class="font-bold text-slate-200 text-xs">Comprar Tela</span>
                    </label>
                    <label class="flex flex-col items-center justify-center text-center cursor-pointer p-2 rounded-lg hover:bg-slate-700/50 transition bg-purple-500/10 border border-purple-500/30">
                        <input type="radio" name="tipoMov" value="confeccion" onchange="toggleForm()" class="accent-purple-500 mb-1 w-4 h-4">
                        <span class="font-bold text-purple-300 text-xs">Confección</span>
                    </label>
                    <label class="flex flex-col items-center justify-center text-center cursor-pointer p-2 rounded-lg hover:bg-slate-700/50 transition">
                        <input type="radio" name="tipoMov" value="gasto" onchange="toggleForm()" class="accent-danger mb-1 w-4 h-4">
                        <span class="font-bold text-slate-200 text-xs">Gasto</span>
                    </label>
                </div>

                <form id="formVenta" onsubmit="registrarVenta(event)" class="space-y-4 relative z-10">
                    <div class="bg-cardhover/50 p-4 rounded-xl border border-slate-700/50 space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Nombre del Cliente / IG (Opcional)</label>
                            <input type="text" id="ventaCliente" placeholder="Ej: @maria_ig o Juan Perez" class="w-full rounded-lg p-2.5 text-white font-bold bg-dark border-slate-600 focus:border-accent" required>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Prenda</label>
                                <select id="ventaProducto" class="w-full rounded-lg p-2.5 text-white font-medium bg-dark border-slate-600" required onchange="actualizarPrecioVenta()"></select>
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Cant</label>
                                    <input type="number" id="ventaCantidad" value="1" min="1" class="w-full rounded-lg p-2.5 text-lg font-bold bg-dark border-slate-600 text-center" required onchange="calcularTotalVenta()">
                                </div>
                                <div>
                                    <label class="block text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-1.5 text-success text-right block">Total Prenda ($)</label>
                                    <input type="number" id="ventaTotal" class="w-full rounded-lg p-2.5 text-lg font-black text-success border-success/30 bg-success/10 text-right" required>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-orange-900/10 p-4 rounded-xl border border-orange-500/20 space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-[10px] font-bold text-orange-300 uppercase tracking-wider mb-1.5">Estado de Entrega</label>
                                <select id="ventaEntrega" class="w-full rounded-lg p-2.5 text-sm bg-dark border-orange-500/30 text-white" required>
                                    <option value="entregado">✅ Entregado ahora</option>
                                    <option value="pendiente" selected>📦 Falta entregar</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-orange-300 uppercase tracking-wider mb-1.5">Método de Pago</label>
                                <select id="ventaPago" class="w-full rounded-lg p-2.5 text-sm bg-dark border-orange-500/30 text-white" required onchange="toggleAbonoInput()">
                                    <option value="completo">💰 Pagó Completo</option>
                                    <option value="abono">💳 Dejó un Abono</option>
                                    <option value="pendiente">❌ Aún no paga</option>
                                </select>
                            </div>
                        </div>
                        
                        <div id="divAbono" class="hidden mt-2 pt-3 border-t border-orange-500/20">
                            <label class="block text-xs font-bold text-orange-400 uppercase tracking-wider mb-1.5">¿Cuánto Abono te dio hoy? ($)</label>
                            <input type="number" id="ventaAbono" placeholder="Ej: 5000" min="0" class="w-full rounded-lg p-3 text-xl font-black text-orange-400 border-orange-400/50 bg-dark text-center">
                        </div>
                    </div>
                    <button type="submit" class="w-full mt-2 bg-success hover:bg-emerald-400 text-slate-900 font-black py-3.5 rounded-xl shadow-neon-success transition-all text-lg tracking-wide uppercase">
                        <i class="fa-solid fa-check mr-2"></i> Registrar Venta
                    </button>
                </form>

                <form id="formCompraMat" onsubmit="registrarCompraMaterial(event)" class="hidden space-y-4 relative z-10">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Insumo comprado</label>
                        <select id="compraMaterialSelect" class="w-full rounded-lg p-3 font-medium bg-dark" required onchange="actualizarPrecioMaterial()"></select>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5" id="labelCantMat">Cantidad comprada</label>
                            <input type="number" step="0.01" id="compraMatCant" value="1" min="0.01" class="w-full rounded-lg p-3 text-lg font-bold bg-dark" required onchange="calcularTotalMaterial()">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5 text-danger">Total Pagado ($)</label>
                            <input type="number" id="compraMatTotal" class="w-full rounded-lg p-3 text-lg font-bold text-danger border-danger/30 bg-danger/10" required>
                        </div>
                    </div>
                    <button type="submit" class="w-full mt-2 bg-accent hover:bg-sky-400 text-slate-900 font-black py-3.5 rounded-xl shadow-[0_0_15px_rgba(56,189,248,0.3)] transition-all text-lg tracking-wide uppercase">
                        Comprar Insumo
                    </button>
                </form>

                <form id="formConfeccion" onsubmit="registrarConfeccion(event)" class="hidden space-y-4 relative z-10">
                    <div>
                        <label class="block text-xs font-semibold text-purple-300 uppercase tracking-wider mb-1.5">Prenda mandada a hacer</label>
                        <select id="confeccionProducto" class="w-full rounded-lg p-3 font-medium text-white border-purple-500/50 bg-dark" required></select>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Cant. Hecha</label>
                            <input type="number" id="confeccionCant" value="1" min="1" class="w-full rounded-lg p-3 text-lg font-bold bg-dark" required onchange="calcularTotalConfeccion()">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Mano de Obra (c/u)</label>
                            <input type="number" id="confeccionCostoUni" placeholder="Ej: 3500" min="0" class="w-full rounded-lg p-3 text-lg font-bold bg-dark" required onchange="calcularTotalConfeccion()">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5 text-danger">Total a Pagar al Taller ($)</label>
                        <input type="number" id="confeccionTotal" class="w-full rounded-lg p-3 text-xl font-black text-danger border-danger/30 bg-danger/10 text-center" required>
                    </div>
                    <button type="submit" class="w-full mt-2 bg-purple-600 hover:bg-purple-500 text-white font-black py-3.5 rounded-xl shadow-[0_0_15px_rgba(147,51,234,0.3)] transition-all text-lg tracking-wide uppercase">
                        Pagar Taller
                    </button>
                </form>

                <form id="formGasto" onsubmit="registrarGasto(event)" class="hidden space-y-4 relative z-10">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Concepto del gasto</label>
                        <input type="text" id="gastoDescripcion" placeholder="Ej: Transporte, Publicidad..." class="w-full rounded-lg p-3 bg-dark" required>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5 text-danger">Monto Gastado ($)</label>
                        <input type="number" id="gastoMonto" min="1" class="w-full rounded-lg p-3 text-xl font-black text-danger border-danger/30 bg-danger/10 text-center" required>
                    </div>
                    <button type="submit" class="w-full mt-2 bg-danger hover:bg-rose-400 text-white font-black py-3.5 rounded-xl shadow-neon-danger transition-all text-lg tracking-wide uppercase">
                        Registrar Gasto
                    </button>
                </form>
            </div>
        </div>

        <!-- TAB: PEDIDOS -->
        <div id="pedidos" class="tab-content">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-2xl font-bold text-white"><i class="fa-solid fa-box-open mr-3 text-orange-400"></i>Gestión de Pedidos</h2>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5" id="listaPedidos"></div>
        </div>

        <!-- TAB: INVENTARIO -->
        <div id="inventario" class="tab-content">
            <div class="grid grid-cols-1 xl:grid-cols-2 gap-8">
                
                <div class="space-y-4">
                    <h2 class="text-xl font-black text-white tracking-tight flex items-center border-b border-slate-700 pb-2"><div class="w-2 h-6 bg-primary rounded-full mr-3"></div>Ropa Terminada</h2>
                    <div class="card-pro p-4 rounded-xl bg-primary/5 border border-primary/20">
                        <form id="formProducto" onsubmit="guardarProducto(event)">
                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-2">
                                <div class="col-span-2 sm:col-span-4"><input id="prodNombre" type="text" placeholder="Nombre Prenda (Ej: Polerón)" class="w-full p-2.5 rounded-lg text-sm bg-dark focus:border-primary" required></div>
                                <div class="col-span-2"><input id="prodTallaColor" type="text" placeholder="Talla / Color" class="w-full p-2.5 rounded-lg text-sm bg-dark focus:border-primary"></div>
                                <div class="col-span-1"><input id="prodStock" type="number" placeholder="Stock" min="0" class="w-full p-2.5 rounded-lg text-sm bg-dark focus:border-primary text-center" required></div>
                                <div class="col-span-1"><input id="prodPrecio" type="number" placeholder="Venta $" class="w-full p-2.5 rounded-lg text-sm bg-dark border-primary/30 text-accent font-bold text-center" required></div>
                            </div>
                            <button type="submit" class="w-full bg-primary hover:bg-indigo-500 text-white font-bold py-2 rounded-lg text-sm transition-all shadow-neon-primary mt-1">Añadir al Catálogo</button>
                        </form>
                    </div>
                    <div class="overflow-x-auto hide-scroll rounded-xl border border-bordercolor bg-card">
                        <table class="min-w-full text-left">
                            <thead class="bg-cardhover border-b border-bordercolor text-[10px] text-slate-400 uppercase">
                                <tr><th class="py-2 px-3">Prenda</th><th class="py-2 px-3 text-center">Stock</th><th class="py-2 px-3 text-right">Precio</th><th class="py-2 px-3"></th></tr>
                            </thead>
                            <tbody id="listaProductos" class="divide-y divide-bordercolor text-sm"></tbody>
                        </table>
                    </div>
                </div>

                <div class="space-y-4">
                    <h2 class="text-xl font-black text-white tracking-tight flex items-center border-b border-slate-700 pb-2"><div class="w-2 h-6 bg-accent rounded-full mr-3"></div>Bodega de Insumos</h2>
                    <div class="card-pro p-4 rounded-xl bg-accent/5 border border-accent/20">
                        <form id="formMaterial" onsubmit="guardarMaterial(event)">
                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-2">
                                <div class="col-span-2 sm:col-span-4"><input id="matNombreForm" type="text" placeholder="Insumo (Ej: Franela Algodón)" class="w-full p-2.5 rounded-lg text-sm bg-dark focus:border-accent" required></div>
                                <div class="col-span-2">
                                    <select id="matUnidadForm" class="w-full p-2.5 rounded-lg text-sm bg-dark focus:border-accent text-slate-300" required>
                                        <option value="kilos">Se compra por Kilos</option>
                                        <option value="metros">Se compra por Metros</option>
                                        <option value="unidades">Se compra por Unids</option>
                                    </select>
                                </div>
                                <div class="col-span-2"><input id="matPrecioForm" type="number" placeholder="Costo c/u $" min="1" class="w-full p-2.5 rounded-lg text-sm bg-dark border-accent/30 text-accent font-bold text-center" required></div>
                            </div>
                            <button type="submit" class="w-full bg-accent text-slate-900 hover:bg-sky-400 font-bold py-2 rounded-lg text-sm transition-all shadow-[0_0_10px_rgba(56,189,248,0.3)] mt-1">Guardar Insumo</button>
                        </form>
                    </div>
                    <div class="overflow-x-auto hide-scroll rounded-xl border border-bordercolor bg-card">
                        <table class="min-w-full text-left">
                            <thead class="bg-cardhover border-b border-bordercolor text-[10px] text-slate-400 uppercase">
                                <tr><th class="py-2 px-3">Insumo</th><th class="py-2 px-3">Bodega</th><th class="py-2 px-3 text-right">Costo</th><th class="py-2 px-3"></th></tr>
                            </thead>
                            <tbody id="listaMaterialesTbody" class="divide-y divide-bordercolor text-sm"></tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <!-- SCRIPT PRINCIPAL & FIREBASE -->
    <script>
        // CONFIGURACION FIREBASE (DE LA IMAGEN DEL USUARIO)
        const firebaseConfig = {
            apiKey: "AIzaSyCeEiyhezhon_3YT37jfXv7OqFq8Tq9h9U",
            authDomain: "dashboard-effb3.firebaseapp.com",
            projectId: "dashboard-effb3",
            storageBucket: "dashboard-effb3.firebasestorage.app",
            messagingSenderId: "433824711915",
            appId: "1:433824711915:web:7d129a7e8ad28b9e2e6aae"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // INIT DATA
        let appData = { productos: [], materiales: [], transacciones: [] };
        let isCloudReady = false;

        document.getElementById('cloudStatus').classList.remove('hidden');

        // REAL-TIME SYNC CON FIRESTORE
        db.collection("tienda").doc("masterData").onSnapshot((doc) => {
            if (doc.exists) {
                appData = doc.data();
                if(!isCloudReady) {
                    isCloudReady = true;
                    document.getElementById('cloudStatus').innerHTML = '<i class="fa-solid fa-cloud-check mr-2"></i> Conectado y sincronizado con la nube';
                    document.getElementById('cloudStatus').className = "mb-4 bg-success/20 border border-success/30 text-success px-4 py-2 rounded-lg text-xs font-bold flex items-center";
                    setTimeout(() => document.getElementById('cloudStatus').classList.add('hidden'), 3000);
                }
                actualizarTodo();
            } else {
                // Si la BD está vacía (primera vez), subimos lo que haya en la PC local
                let savedData = localStorage.getItem('ropaAppMasterData');
                if (savedData) {
                    let parsed = JSON.parse(savedData);
                    appData.productos = parsed.productos || [];
                    appData.materiales = parsed.materiales || [];
                    appData.transacciones = parsed.transacciones || [];
                    db.collection("tienda").doc("masterData").set(appData);
                    showToast("Base de datos local migrada a la nube", "success");
                } else {
                    // Si no hay local y no hay nube, inicializa vacío.
                    db.collection("tienda").doc("masterData").set(appData);
                }
                isCloudReady = true;
            }
        }, (error) => {
            console.error("Error de Firestore:", error);
            document.getElementById('cloudStatus').innerHTML = '<i class="fa-solid fa-cloud-xmark mr-2"></i> Error de conexión (Revise permisos o red)';
            document.getElementById('cloudStatus').className = "mb-4 bg-danger/20 border border-danger/30 text-danger px-4 py-2 rounded-lg text-xs font-bold flex items-center";
        });

        // FUNCION CENTRAL DE GUARDADO (Pushea a la nube)
        function guardarDatos() {
            if(isCloudReady) {
                db.collection("tienda").doc("masterData").set(appData)
                    .catch(e => showToast("Error al guardar: " + e.message, "danger"));
            }
            // Mantenemos backup local por si acaso
            localStorage.setItem('ropaAppMasterData', JSON.stringify(appData));
        }

        // ============================================
        // FUNCIONES DE LA APP
        // ============================================

        // Dialog System 
        let confirmCallback = null;
        function showConfirm(title, message, btnText, btnColor, callback) {
            document.getElementById('dialogTitle').innerText = title;
            document.getElementById('dialogMessage').innerText = message;
            document.getElementById('dialogConfirmBtn').innerHTML = `<i class="fa-solid fa-check mr-1"></i> ${btnText}`;
            document.getElementById('dialogConfirmBtn').className = `px-5 py-2 rounded-lg text-white transition font-bold shadow-lg text-sm hover:scale-105 ${btnColor}`;
            confirmCallback = callback;
            const dialog = document.getElementById('customDialog');
            dialog.classList.remove('hidden');
            setTimeout(() => {
                dialog.classList.remove('opacity-0');
                document.getElementById('dialogBox').classList.remove('scale-95');
                document.getElementById('dialogBox').classList.add('scale-100');
            }, 10);
        }
        function closeDialog() {
            const dialog = document.getElementById('customDialog');
            dialog.classList.add('opacity-0');
            document.getElementById('dialogBox').classList.remove('scale-100');
            document.getElementById('dialogBox').classList.add('scale-95');
            setTimeout(() => dialog.classList.add('hidden'), 200);
        }
        document.getElementById('dialogConfirmBtn').addEventListener('click', () => { if(confirmCallback) confirmCallback(); closeDialog(); });

        // Toast System
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const color = type === 'success' ? 'bg-success/90 border-success/50 text-white' : (type === 'danger' ? 'bg-danger/90 border-danger/50 text-white' : (type === 'purple' ? 'bg-purple-600/90 border-purple-500/50 text-white' : 'bg-primary/90 border-primary/50 text-white'));
            toast.className = `border ${color} backdrop-blur-md px-5 py-3 rounded-xl shadow-2xl flex items-center transform transition-all duration-300 translate-y-10 opacity-0`;
            toast.innerHTML = `<span class="font-bold text-sm tracking-wide">${message}</span>`;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-10', 'opacity-0'));
            setTimeout(() => { toast.classList.add('translate-y-10', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function formatearMoneda(valor) { return '$' + parseFloat(valor).toLocaleString('es-CO'); }
        function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2); }
        function formatearFecha(isoString) { try { const f = new Date(isoString); return `${f.getDate().toString().padStart(2, '0')}/${(f.getMonth()+1).toString().padStart(2, '0')} ${f.getHours().toString().padStart(2,'0')}:${f.getMinutes().toString().padStart(2,'0')}`; } catch(e) { return "-"; } }

        // TABS
        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
        }

        // DASHBOARD
        function actualizarDashboard() {
            const ingresos = appData.transacciones.filter(t => t.tipo === 'ingreso').reduce((acc, curr) => acc + (curr.monto || 0), 0);
            const gastos = appData.transacciones.filter(t => t.tipo === 'gasto').reduce((acc, curr) => acc + (curr.monto || 0), 0);
            const ganancia = ingresos - gastos;
            document.getElementById('totalIngresos').innerText = formatearMoneda(ingresos);
            document.getElementById('totalGastos').innerText = formatearMoneda(gastos);
            const gn = document.getElementById('gananciaNeta');
            gn.innerText = formatearMoneda(ganancia);
            if(ganancia > 0) gn.className = 'text-4xl font-black mt-1 text-success tracking-tight relative z-10';
            else if(ganancia < 0) gn.className = 'text-4xl font-black mt-1 text-danger tracking-tight relative z-10';
            else gn.className = 'text-4xl font-black mt-1 text-white tracking-tight relative z-10';
        }

        // INVENTARIO - PRENDAS
        function guardarProducto(e) {
            e.preventDefault();
            appData.productos.push({ id: generateId(), nombre: document.getElementById('prodNombre').value, talla: document.getElementById('prodTallaColor').value || '', stock: parseInt(document.getElementById('prodStock').value), precio: parseFloat(document.getElementById('prodPrecio').value) });
            guardarDatos();
            e.target.reset();
            showToast("Prenda añadida", "success");
        }
        function eliminarProducto(id) { showConfirm('Eliminar', '¿Borrar esta prenda?', 'Borrar', 'bg-rose-600', () => { appData.productos = appData.productos.filter(p => p.id && p.id.toString() !== id.toString()); guardarDatos(); showToast("Prenda eliminada", "success"); }); }
        function renderizarInventario() {
            const tbody = document.getElementById('listaProductos'); tbody.innerHTML = '';
            if (appData.productos.length === 0) tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-slate-500 italic text-xs">Aún no hay ropa registrada.</td></tr>';
            appData.productos.forEach(p => {
                const stockBadge = p.stock > 0 ? 'text-success' : 'text-danger';
                const tr = document.createElement('tr'); tr.className = "hover:bg-slate-800 transition-colors border-b border-slate-800/50";
                tr.innerHTML = `<td class="py-2.5 px-3 font-bold text-slate-200">${p.nombre} <span class="text-xs text-slate-500 font-normal ml-1">${p.talla}</span></td><td class="py-2.5 px-3 text-center font-black ${stockBadge}">${p.stock}</td><td class="py-2.5 px-3 text-accent font-bold text-right">${formatearMoneda(p.precio)}</td><td class="py-2.5 px-3 text-right"><button onclick="eliminarProducto('${p.id}')" class="text-slate-500 hover:text-rose-500 transition-colors"><i class="fa-solid fa-trash-can"></i></button></td>`;
                tbody.appendChild(tr);
            });
            llenarSelectVentas(); llenarSelectConfeccion();
        }

        // INVENTARIO - MATERIALES
        function guardarMaterial(e) {
            e.preventDefault();
            appData.materiales.push({ id: generateId(), nombre: document.getElementById('matNombreForm').value, unidad: document.getElementById('matUnidadForm').value, precioUnitario: parseFloat(document.getElementById('matPrecioForm').value), stock: 0 });
            guardarDatos(); e.target.reset(); showToast("Insumo añadido", "success");
        }
        function eliminarMaterial(id) { showConfirm('Eliminar', '¿Borrar insumo?', 'Borrar', 'bg-rose-600', () => { appData.materiales = appData.materiales.filter(m => m.id && m.id.toString() !== id.toString()); guardarDatos(); showToast("Insumo eliminado", "success"); }); }
        function renderizarMateriales() {
            const tbody = document.getElementById('listaMaterialesTbody'); tbody.innerHTML = '';
            if (appData.materiales.length === 0) tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-slate-500 italic text-xs">No hay insumos.</td></tr>';
            appData.materiales.forEach(m => {
                const tr = document.createElement('tr'); tr.className = "hover:bg-slate-800 transition-colors border-b border-slate-800/50";
                tr.innerHTML = `<td class="py-2.5 px-3 font-bold text-slate-200">${m.nombre}</td><td class="py-2.5 px-3 text-xs text-slate-300">${m.stock} ${m.unidad}</td><td class="py-2.5 px-3 text-accent font-bold text-right">${formatearMoneda(m.precioUnitario)}</td><td class="py-2.5 px-3 text-right"><button onclick="eliminarMaterial('${m.id}')" class="text-slate-500 hover:text-rose-500 transition-colors"><i class="fa-solid fa-trash-can"></i></button></td>`;
                tbody.appendChild(tr);
            });
            llenarSelectComprasMaterial();
        }

        // CAJA 
        function toggleForm() {
            const tipo = document.querySelector('input[name="tipoMov"]:checked').value;
            ['formVenta', 'formCompraMat', 'formConfeccion', 'formGasto'].forEach(id => document.getElementById(id).classList.add('hidden'));
            if (tipo === 'venta') document.getElementById('formVenta').classList.remove('hidden');
            if (tipo === 'compra_mat') document.getElementById('formCompraMat').classList.remove('hidden');
            if (tipo === 'confeccion') document.getElementById('formConfeccion').classList.remove('hidden');
            if (tipo === 'gasto') document.getElementById('formGasto').classList.remove('hidden');
        }
        function toggleAbonoInput() {
            const pago = document.getElementById('ventaPago').value;
            if (pago === 'abono') { document.getElementById('divAbono').classList.remove('hidden'); document.getElementById('ventaAbono').required = true; document.getElementById('ventaAbono').value = ''; } 
            else { document.getElementById('divAbono').classList.add('hidden'); document.getElementById('ventaAbono').required = false; document.getElementById('ventaAbono').value = 0; }
        }

        // Selects
        function llenarSelectVentas() {
            const s = document.getElementById('ventaProducto'); s.innerHTML = '<option value="">-- Selecciona Prenda --</option>';
            appData.productos.filter(p => p.stock > 0).forEach(p => { const o = document.createElement('option'); o.value = p.id; o.text = `${p.nombre} ${p.talla ? '('+p.talla+')' : ''} - $${p.precio}`; o.dataset.precio = p.precio; s.appendChild(o); });
            actualizarPrecioVenta();
        }
        function llenarSelectConfeccion() {
            const s = document.getElementById('confeccionProducto'); if(!s) return; s.innerHTML = '<option value="">-- Selecciona Prenda --</option>';
            appData.productos.forEach(p => { const o = document.createElement('option'); o.value = p.id; o.text = `${p.nombre} ${p.talla ? '('+p.talla+')' : ''}`; s.appendChild(o); });
        }
        function llenarSelectComprasMaterial() {
            const s = document.getElementById('compraMaterialSelect'); s.innerHTML = '<option value="">-- Selecciona Tela --</option>';
            appData.materiales.forEach(m => { const o = document.createElement('option'); o.value = m.id; o.text = `${m.nombre} - $${m.precioUnitario} x ${m.unidad}`; o.dataset.precio = m.precioUnitario; o.dataset.unidad = m.unidad; s.appendChild(o); });
            actualizarPrecioMaterial();
        }

        // Lógicas Venta/Gasto
        function actualizarPrecioVenta() { const s = document.getElementById('ventaProducto'); if(!s.options[s.selectedIndex]) return; document.getElementById('ventaTotal').value = s.options[s.selectedIndex].dataset.precio ? s.options[s.selectedIndex].dataset.precio * (document.getElementById('ventaCantidad').value || 1) : ''; }
        function calcularTotalVenta() { actualizarPrecioVenta(); }
        function registrarVenta(e) {
            e.preventDefault();
            const prodId = document.getElementById('ventaProducto').value; if(!prodId) return showToast("Selecciona un producto.", "danger");
            const prod = appData.productos.find(p => p.id.toString() === prodId.toString()); const cant = parseInt(document.getElementById('ventaCantidad').value);
            if(prod.stock < cant) return showToast(`Solo quedan ${prod.stock} en stock`, "danger");
            
            const totalVenta = parseFloat(document.getElementById('ventaTotal').value);
            const clienteLibre = document.getElementById('ventaCliente').value.trim() || 'Cliente sin nombre';
            const estadoEntrega = document.getElementById('ventaEntrega').value; const estadoPago = document.getElementById('ventaPago').value;
            
            let montoRealRecibido = 0; let deuda = 0;
            if (estadoPago === 'completo') montoRealRecibido = totalVenta;
            else if (estadoPago === 'pendiente') { montoRealRecibido = 0; deuda = totalVenta; } 
            else if (estadoPago === 'abono') {
                montoRealRecibido = parseFloat(document.getElementById('ventaAbono').value) || 0;
                if(montoRealRecibido >= totalVenta) { montoRealRecibido = totalVenta; }
                deuda = totalVenta - montoRealRecibido;
            }

            prod.stock -= cant; 
            appData.transacciones.push({ id: generateId(), tipo: 'ingreso', fecha: new Date().toISOString(), descripcion: `${cant}x ${prod.nombre} ${prod.talla} (a ${clienteLibre})`, monto: montoRealRecibido, montoTotalVenta: totalVenta, deuda: deuda, estadoEntrega: estadoEntrega, estadoPago: estadoPago === 'abono' && deuda <= 0 ? 'completo' : estadoPago, esVenta: true, prodId: prodId, cant: cant, cliente: clienteLibre });
            guardarDatos(); e.target.reset(); document.getElementById('divAbono').classList.add('hidden'); showToast("¡Venta guardada en la nube!", "success");
        }

        function actualizarPrecioMaterial() { const s = document.getElementById('compraMaterialSelect'); if(!s.options[s.selectedIndex]) return; if(s.options[s.selectedIndex].dataset.unidad) document.getElementById('labelCantMat').innerText = `Cant. comprada (${s.options[s.selectedIndex].dataset.unidad})`; document.getElementById('compraMatTotal').value = s.options[s.selectedIndex].dataset.precio ? s.options[s.selectedIndex].dataset.precio * (document.getElementById('compraMatCant').value || 1) : ''; }
        function calcularTotalMaterial() { actualizarPrecioMaterial(); }
        function registrarCompraMaterial(e) {
            e.preventDefault();
            const matId = document.getElementById('compraMaterialSelect').value; if(!matId) return showToast("Selecciona un material.", "danger");
            const mat = appData.materiales.find(m => m.id.toString() === matId.toString()); const cant = parseFloat(document.getElementById('compraMatCant').value); const total = parseFloat(document.getElementById('compraMatTotal').value);
            mat.stock += cant; 
            appData.transacciones.push({ id: generateId(), tipo: 'gasto', fecha: new Date().toISOString(), descripcion: `Tela: ${cant} ${mat.unidad} de ${mat.nombre}`, monto: total, esCompraMaterial: true, matId: matId, cant: cant });
            guardarDatos(); e.target.reset(); showToast(`¡Compra guardada en la nube!`, "success");
        }
        
        function calcularTotalConfeccion() { document.getElementById('confeccionTotal').value = (parseFloat(document.getElementById('confeccionCant').value) || 0) * (parseFloat(document.getElementById('confeccionCostoUni').value) || 0); }
        function registrarConfeccion(e) {
            e.preventDefault();
            const prodId = document.getElementById('confeccionProducto').value; if(!prodId) return showToast("Selecciona una prenda.", "danger");
            const prod = appData.productos.find(p => p.id.toString() === prodId.toString()); const cant = parseInt(document.getElementById('confeccionCant').value); const total = parseFloat(document.getElementById('confeccionTotal').value);
            prod.stock += cant;
            appData.transacciones.push({ id: generateId(), tipo: 'gasto', fecha: new Date().toISOString(), descripcion: `Taller: ${cant}x ${prod.nombre} hechas`, monto: total, esConfeccion: true, prodId: prodId, cant: cant });
            guardarDatos(); e.target.reset(); showToast(`¡Taller pagado (sincronizado)!`, "purple");
        }

        function registrarGasto(e) {
            e.preventDefault();
            appData.transacciones.push({ id: generateId(), tipo: 'gasto', fecha: new Date().toISOString(), descripcion: document.getElementById('gastoDescripcion').value, monto: parseFloat(document.getElementById('gastoMonto').value) });
            guardarDatos(); e.target.reset(); showToast("Gasto en la nube", "success");
        }

        // PEDIDOS
        function renderizarPedidos() {
            const container = document.getElementById('listaPedidos'); container.innerHTML = '';
            const ventas = appData.transacciones.filter(t => t.esVenta);
            if(ventas.length === 0) { container.innerHTML = '<div class="col-span-full text-center py-10 text-slate-500 italic text-sm">Cero pedidos registrados.</div>'; return; }

            [...ventas].reverse().forEach(v => {
                const isEntregado = v.estadoEntrega === 'entregado'; const tieneDeuda = v.deuda > 0;
                if (v.estadoEntrega === undefined) { v.estadoEntrega = 'entregado'; v.estadoPago = 'completo'; v.deuda = 0; }
                const card = document.createElement('div'); card.className = "card-pro p-4 sm:p-5 rounded-2xl flex flex-col justify-between border-t-4 " + (tieneDeuda ? "border-t-orange-400" : "border-t-success");
                let btnEntrega = isEntregado ? `<span class="text-[10px] sm:text-xs font-bold text-success"><i class="fa-solid fa-check mr-1"></i> Listo</span>` : `<button onclick="marcarEntregado('${v.id}')" class="text-[10px] sm:text-xs font-bold text-orange-400 hover:text-white bg-orange-400/10 hover:bg-orange-500 px-2 py-1 rounded transition border border-orange-400/30">📦 Entregar</button>`;
                let btnPago = tieneDeuda ? `<button onclick="saldarDeuda('${v.id}')" class="text-[10px] sm:text-xs font-bold text-rose-400 hover:text-white bg-rose-400/10 hover:bg-rose-500 px-2 py-1 rounded transition border border-rose-400/30">💵 Cobrar ${formatearMoneda(v.deuda)}</button>` : `<span class="text-[10px] sm:text-xs font-bold text-success"><i class="fa-solid fa-check mr-1"></i> Pagado</span>`;
                card.innerHTML = `<div class="mb-4"><div class="flex justify-between items-start mb-1"><h3 class="font-black text-white text-lg sm:text-xl tracking-tight leading-tight uppercase text-accent">${v.cliente || 'Sin Nombre'}</h3><span class="text-[9px] sm:text-[10px] text-slate-500 bg-slate-800 px-2 py-1 rounded font-mono">${formatearFecha(v.fecha).split(' ')[0]}</span></div><p class="text-slate-300 text-xs sm:text-sm flex items-start"><i class="fa-solid fa-shirt mt-1 mr-2 text-slate-500"></i> <span class="leading-tight font-medium">${v.descripcion}</span></p></div><div class="space-y-2 bg-cardhover p-3 rounded-xl border border-bordercolor mt-auto"><div class="flex justify-between items-center"><span class="text-[10px] font-bold text-slate-400 uppercase">Entrega:</span>${btnEntrega}</div><div class="flex justify-between items-center pt-2 border-t border-slate-700/50"><span class="text-[10px] font-bold text-slate-400 uppercase">Pago:</span>${btnPago}</div></div>`;
                container.appendChild(card);
            });
        }
        function marcarEntregado(id) {
            const v = appData.transacciones.find(t => t.id.toString() === id.toString());
            if(v) { v.estadoEntrega = 'entregado'; guardarDatos(); showToast("¡Pedido Entregado!", "success"); }
        }
        function saldarDeuda(id) {
            const v = appData.transacciones.find(t => t.id.toString() === id.toString());
            if(v && v.deuda > 0) {
                showConfirm('Saldar Deuda', `¿Confirmar pago de ${formatearMoneda(v.deuda)} restante?`, 'Sí, pagado', 'bg-success', () => {
                    appData.transacciones.push({ id: generateId(), tipo: 'ingreso', fecha: new Date().toISOString(), descripcion: `Pago Deuda: ${v.cliente}`, monto: v.deuda, esPagoDeuda: true, ventaOriginalId: v.id });
                    v.estadoPago = 'completo'; v.monto += v.deuda; v.deuda = 0; guardarDatos(); showToast("Cobro sincronizado en la nube", "success");
                });
            }
        }

        // HISTORIAL
        function renderizarHistorial() {
            const tbody = document.getElementById('listaHistorial'); tbody.innerHTML = '';
            if (appData.transacciones.length === 0) tbody.innerHTML = '<tr><td colspan="5" class="text-center py-6 text-slate-500 italic text-xs">Aún no hay movimientos.</td></tr>';
            [...appData.transacciones].reverse().forEach(t => {
                const isIngreso = t.tipo === 'ingreso'; const safeId = t.id ? t.id.toString() : '';
                let badgeStyle = isIngreso ? 'text-success' : 'text-danger'; let badgeText = isIngreso ? 'Ingreso' : 'Gasto';
                if (t.esConfeccion) { badgeStyle = 'text-purple-400'; badgeText = 'Taller'; }
                if (t.esPagoDeuda) { badgeText = 'Cobro'; badgeStyle = 'text-orange-400'; }
                const tr = document.createElement('tr'); tr.className = "hover:bg-slate-800 transition-colors border-b border-slate-800/50";
                tr.innerHTML = `<td class="py-2.5 px-4 text-[10px] font-mono text-slate-500 whitespace-nowrap">${formatearFecha(t.fecha)}</td><td class="py-2.5 px-4 font-semibold text-slate-200 text-xs sm:text-sm truncate max-w-[120px] sm:max-w-xs" title="${t.descripcion}">${t.descripcion}</td><td class="py-2.5 px-4"><span class="text-[10px] font-bold uppercase tracking-wider ${badgeStyle}">${badgeText}</span></td><td class="py-2.5 px-4 text-right font-black whitespace-nowrap ${isIngreso ? 'text-success' : 'text-danger'}">${t.monto === 0 ? '$0' : (isIngreso ? '+' : '-') + formatearMoneda(t.monto)}</td><td class="py-2.5 px-4 text-center"><button onclick="eliminarTransaccion('${safeId}')" class="text-slate-600 hover:text-rose-500 transition-all"><i class="fa-solid fa-xmark"></i></button></td>`;
                tbody.appendChild(tr);
            });
        }
        function eliminarTransaccion(id) {
            const tIndex = appData.transacciones.findIndex(t => t.id && t.id.toString() === id.toString()); if (tIndex === -1) return; const t = appData.transacciones[tIndex];
            showConfirm('Eliminar Movimiento', 'Se revertirá el stock si corresponde.', 'Eliminar', 'bg-rose-600', () => {
                if(t.esVenta && t.prodId) { const p = appData.productos.find(p => p.id && p.id.toString() === t.prodId.toString()); if(p) p.stock += (t.cant || 1); }
                if(t.esCompraMaterial && t.matId) { const m = appData.materiales.find(m => m.id && m.id.toString() === t.matId.toString()); if(m) { m.stock -= (t.cant || 0); if(m.stock < 0) m.stock = 0; } }
                if(t.esConfeccion && t.prodId) { const p = appData.productos.find(p => p.id && p.id.toString() === t.prodId.toString()); if(p) { p.stock -= (t.cant || 0); if(p.stock < 0) p.stock = 0; } }
                if(t.esPagoDeuda && t.ventaOriginalId) { const og = appData.transacciones.find(v => v.id === t.ventaOriginalId); if(og) { og.deuda += t.monto; og.monto -= t.monto; og.estadoPago = 'abono'; } }
                appData.transacciones.splice(tIndex, 1); guardarDatos(); showToast("Movimiento borrado", "success");
            });
        }
        function limpiarHistorial() {
            if(appData.transacciones.length === 0) return;
            showConfirm('Borrar TODO', 'Se borrarán ventas y gastos. No afectará inventario.', 'Limpiar Todo', 'bg-rose-600', () => {
                appData.transacciones = []; guardarDatos(); showToast("Caja limpia", "success");
            });
        }
        function confirmarResetTotal() {
            showConfirm('RESET DE FÁBRICA', 'Se borrará absolutamente TODO en la nube.', 'Formatear Sistema', 'bg-rose-600', () => {
                appData = { productos: [], materiales: [], transacciones: [] }; guardarDatos(); localStorage.clear(); location.reload();
            });
        }

        function actualizarTodo() {
            actualizarDashboard(); renderizarInventario(); renderizarMateriales(); renderizarPedidos(); renderizarHistorial();
        }
    </script>
</body>
</html>
